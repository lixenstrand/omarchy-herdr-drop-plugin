name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Pinned to a specific digest instead of the mutable `latest` tag so the
    # base image can't change under us between runs.
    container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin the package mirror to a fixed Arch Linux Archive snapshot
        run: |
          echo 'Server=https://archive.archlinux.org/repos/2026/09/01/$repo/os/$arch' \
            > /etc/pacman.d/mirrorlist
      - name: Install test dependencies
        run: pacman -Sy --noconfirm git jq qt6-declarative
      - name: Fetch the Omarchy plugin contract
        # Pinned to an exact commit instead of tracking the moving `quattro`
        # branch tip, so the contract this job validates against is fixed.
        run: |
          git init -q /tmp/omarchy
          git -C /tmp/omarchy remote add origin https://github.com/basecamp/omarchy.git
          git -C /tmp/omarchy fetch --depth 1 origin 7eca64e2683d2a4d4620f36164f001693ae6a5b7
          git -C /tmp/omarchy checkout -q FETCH_HEAD
      - name: Validate and test
        env:
          OMARCHY_SHELL_ROOT: /tmp/omarchy/shell
        run: |
          export PATH="/tmp/omarchy/bin:$PATH"
          ./test/run
